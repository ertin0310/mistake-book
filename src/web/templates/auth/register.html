{% extends "auth/_shell.html" %}
{% block title %}注册{% endblock %}
{% block body %}
<form method="post" action="{{ url_for('auth.register') }}" class="stack">
  {{ csrf_input() | safe }}
  <label>用户名
    <input name="username" autocomplete="username" maxlength="20" required autofocus>
  </label>
  <label>密码
    <input name="password" type="password" autocomplete="new-password" required>
  </label>
  <label>再输一遍
    <input name="confirm" type="password" autocomplete="new-password" required>
  </label>
  <button class="primary">注册并登录</button>
</form>
<p class="foot">已经有账号了？<a href="{{ url_for('auth.login') }}">去登录</a></p>
{% endblock %}
